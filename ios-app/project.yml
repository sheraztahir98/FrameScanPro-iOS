name: FrameScanPro
options:
  bundleIdPrefix: com.framescan
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "16.0"
targets:
  FrameScanPro:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FrameScanPro
    info:
      path: FrameScanPro/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framescan.pro.lidar
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
