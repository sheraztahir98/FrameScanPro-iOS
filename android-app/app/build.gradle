plugins {
    id 'com.android.application'
}

android {
    namespace 'com.framescanpro.laser'
    compileSdk 34

    defaultConfig {
        applicationId "com.framescanpro.laser"
        minSdk 24
        targetSdk 34
        versionCode 40
        versionName "4.0-PRO"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
